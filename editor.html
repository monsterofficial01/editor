<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Executor</title>
<style>
  :root {
    --bg-color: #000000;
    --border-color: #2a2a2a;
    --accent-purple: #7c5dfa;
    --text-main: #ffffff;
    --text-dim: #9aa4b8;
    --status-bg: #0a0a0a;
    --hover-bg: rgba(255,255,255,0.05);
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: var(--bg-color);
    color: var(--text-main);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #app-wrapper {
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-color);
  }
  .logo {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
  }

  /* Styled M Logo */
  .logo svg { fill: #fff; width: 20px; height: 20px; }

  .title-area { font-size: 12px; font-weight: 500; opacity: 0.8; display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--accent-purple); color: white; font-size: 9px; padding: 1px 4px; border-radius: 2px; text-transform: uppercase; }

  .window-controls { margin-left: auto; display: flex; gap: 8px; }
  .control-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; background: var(--hover-bg); cursor: pointer; transition: background 0.2s;
  }
  .control-btn:hover { background: rgba(255,255,255,0.1); }

#monaco-container {
    flex: 1;
    position: relative;
    height: 100%;
}
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: var(--bg-color); z-index: 20;
  }

  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(124, 93, 250, 0.1); border-top-color: var(--accent-purple);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .action-buttons {
    position: absolute; right: 16px; bottom: 40px; display: flex; gap: 8px; z-index: 5;
  }

  .action-btn {
    width: 32px; height: 32px; background: #111; border: 1px solid var(--border-color);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; transition: all 0.2s;
  }

  .action-btn:hover { border-color: var(--accent-purple); background: #1a1a1a; }
  .action-btn svg { width: 16px; height: 16px; }

  #statusbar {
    height: 24px; background: var(--status-bg); border-top: 1px solid var(--border-color);
    display: flex; align-items: center; padding: 0 12px; gap: 16px;
    font-size: 11px; color: var(--text-dim); user-select: none; z-index: 10;
  }

  #statusbar .item { display: flex; align-items: center; gap: 4px; }
  #statusbar .spacer { flex: 1; }
</style>
</head>
<body>

<div id="app-wrapper">
  <div id="monaco-container">
    <div id="loading"><div class="spinner"></div><span>LOADING EDITOR...</span></div>
  </div>

  <div class="action-buttons">
    <div class="action-btn" title="Undo" onclick="editor.trigger('','undo','')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg></div>
    <div class="action-btn" title="Redo" onclick="editor.trigger('','redo','')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg></div>
  </div>

  <div id="statusbar">
    <div class="item"><span>🌙</span> Monster Executor</div>
    <div class="item" id="sb-cursor">Ln 1, Col 1</div>
    <div class="spacer"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
/* ---------------------- Roblox Snippets ---------------------- */
const Snippets = [
  {trigger:"for", desc:"Numeric loop", body:"for ${1:i} = ${2:1}, ${3:10} do\n\t$0\nend"},
  {trigger:"fori", desc:"Array loop (ipairs)", body:"for ${1:i}, ${2:v} in ipairs(${3:table}) do\n\t$0\nend"},
  {trigger:"forp", desc:"Dictionary loop (pairs)", body:"for ${1:k}, ${2:v} in pairs(${3:table}) do\n\t$0\nend"},
  {trigger:"if", desc:"If statement", body:"if ${1:condition} then\n\t$0\nend"},
  {trigger:"ife", desc:"If-Else statement", body:"if ${1:condition} then\n\t$2\nelse\n\t$0\nend"},
  {trigger:"func", desc:"Local function", body:"local function ${1:name}(${2:args})\n\t$0\nend"},
  {trigger:"gv", desc:"Get Service", body:"local ${1:TweenService} = game:GetService(\"${1:TweenService}\")"},
  {trigger:"lp", desc:"Local Player", body:"local Players = game:GetService(\"Players\")\nlocal player = Players.LocalPlayer"},
  {trigger:"char", desc:"Character Reference", body:"local character = player.Character or player.CharacterAdded:Wait()"},
  {trigger:"hum", desc:"Humanoid Reference", body:"local humanoid = character:WaitForChild(\"Humanoid\")"},
  {trigger:"conn", desc:"Connect event", body:"${1:object}.${2:Event}:Connect(function(${3:args})\n\t$0\nend)"},
  {trigger:"pjoin", desc:"Player Added", body:"game.Players.PlayerAdded:Connect(function(player)\n\t$0\nend)"},
  {trigger:"touched", desc:"Part Touched", body:"${1:script.Parent}.Touched:Connect(function(hit)\n\tlocal character = hit.Parent\n\tlocal humanoid = character:FindFirstChildOfClass(\"Humanoid\")\n\tif humanoid then\n\t\t$0\n\tend\nend)"},
  {trigger:"tween", desc:"TweenService Create", body:"local TweenService = game:GetService(\"TweenService\")\nlocal info = TweenInfo.new(${1:1}, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)\nlocal tween = TweenService:Create(${2:object}, info, {${3:Property} = ${4:Value}})\ntween:Play()"},
  {trigger:"new", desc:"Instance.new", body:"local ${1:part} = Instance.new(\"${2:Part}\")\n${1:part}.Parent = ${3:workspace}\n$0"},
  {trigger:"pcall", desc:"Protected Call", body:"local success, result = pcall(function()\n\t$0\nend)\nif not success then\n\twarn(\"Error: \" .. result)\nend"},
  {trigger:"module", desc:"Module Script Template", body:"local ${1:Module} = {}\n\nfunction ${1:Module}.init()\n\t$0\nend\n\nreturn ${1:Module}"},
  {trigger:"wait", desc:"Task Wait", body:"task.wait(${1:1})"},
  {trigger:"spawn", desc:"Task Spawn", body:"task.spawn(function()\n\t$0\nend)"},
  {trigger:"remote", desc:"RemoteEvent Fire (Client)", body:"game:GetService(\"ReplicatedStorage\"):WaitForChild(\"${1:RemoteEvent}\"):FireServer($0)"},
  {trigger:"onremote", desc:"RemoteEvent Listen (Server)", body:"game:GetService(\"ReplicatedStorage\"):WaitForChild(\"${1:RemoteEvent}\").OnServerEvent:Connect(function(player, $2)\n\t$0\nend)"}
];

const RobloxAPI = {
  globals: [
    {label:"game", kind:"global", detail:"DataModel", doc:"The root of the Roblox game hierarchy."},
    {label:"workspace", kind:"global", detail:"Workspace", doc:"Shortcut for game:GetService(\"Workspace\")."},
    {label:"script", kind:"global", detail:"Instance", doc:"The script object currently running."},
    {label:"task", kind:"global", detail:"Library", doc:"Task scheduler library (wait, spawn, delay)."},
    {label:"Enum", kind:"global", detail:"Enums", doc:"Access to all Roblox enums."},
    {label:"Vector3", kind:"global", detail:"DataType", doc:"3D vector class."},
    {label:"CFrame", kind:"global", detail:"DataType", doc:"Coordinate Frame class."},
    {label:"Color3", kind:"global", detail:"DataType", doc:"RGB color class."}
  ]
};

/* ---------------------- Editor Logic ---------------------- */
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' }});

let editor, monacoRef;

// --- External API Functions ---
function ClearFunction() {
  if (editor) {
    editor.setValue("");
  }
}

function GetContent() {
  if (editor) {
    return editor.getValue();
  }
  return "";
}

// Expose to window for external access
window.ClearFunction = ClearFunction;
window.GetContent = GetContent;

require(['vs/editor/editor.main'], function() {
  monacoRef = monaco;

  monaco.editor.defineTheme('app-theme', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'comment', foreground: '6a9955' },
      { token: 'keyword', foreground: 'c586c0' },
      { token: 'string', foreground: 'ce9178' },
      { token: 'number', foreground: 'b5cea8' },
      { token: 'operator', foreground: 'd4d4d4' },
      { token: 'identifier', foreground: '9cdcfe' },
      { token: 'type.identifier', foreground: '4ec9b0' }
    ],
    colors: {
      'editor.background': '#000000',
      'editor.foreground': '#d4d4d4',
      'editorCursor.foreground': '#ffffff',
      'editor.lineHighlightBackground': '#ffffff08',
      'editorLineNumber.foreground': '#444444',
      'editor.selectionBackground': '#264f78',
      'editorInactiveSelectionBackground': '#3a3d41',
      'editorWidget.background': '#0a0a0a',
      'editorWidget.border': '#2a2a2a',
      'editorSuggestWidget.background': '#0a0a0a',
      'editorSuggestWidget.border': '#2a2a2a',
      'editorSuggestWidget.selectedBackground': '#264f78'
    }
  });

  registerLuau();

  editor = monaco.editor.create(document.getElementById('monaco-container'), {
    value: "-- Monster executor",
    language: 'luau',
    theme: 'app-theme',
    automaticLayout: true,
    fontSize: 13,
    fontFamily: "'Fira Code', 'Cascadia Code', Consolas, monospace",
    minimap: { enabled: false },
    padding: { top: 12, bottom: 12 },
    cursorBlinking: "smooth",
    smoothScrolling: true,
    renderLineHighlight: "all"
  });

  editor.onDidChangeCursorPosition(e => {
    document.getElementById('sb-cursor').textContent = `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
  });

  document.getElementById('loading').style.display = 'none';
});

function registerLuau() {
  monaco.languages.register({ id: 'luau' });
  monaco.languages.setMonarchTokensProvider('luau', {
    keywords: ['and','break','do','else','elseif','end','false','for','function','if','in','local','nil','not','or','repeat','return','then','true','until','while','continue'],
    tokenizer: {
      root: [
        [/[a-zA-Z_]\w*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
        [/\-\-.*$/, 'comment'],
        [/\d*\.\d+([eE][\-+]?\d+)?/, 'number.float'],
        [/\d+/, 'number'],
        [/"/, 'string', '@string'],
      ],
      string: [[/[^\\"]+/, 'string'], [/\\./, 'string.escape'], [/"/, 'string', '@pop']],
    }
  });

  monaco.languages.registerCompletionItemProvider('luau', {
    provideCompletionItems(model, position) {
      const word = model.getWordUntilPosition(position);
      const range = { startLineNumber: position.lineNumber, endLineNumber: position.lineNumber, startColumn: word.startColumn, endColumn: word.endColumn };
      const suggestions = [];
      RobloxAPI.globals.forEach(g => {
        suggestions.push({ label: g.label, kind: monaco.languages.CompletionItemKind.Variable, detail: g.detail, documentation: g.doc, insertText: g.label, range });
      });
      Snippets.forEach(s => {
        suggestions.push({ label: s.trigger, kind: monaco.languages.CompletionItemKind.Snippet, detail: s.desc, insertText: s.body, insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet, range });
      });
      return { suggestions };
    }
  });
}

function copyCode() {
  const code = GetContent();
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('[onclick="copyCode()"]');
    const original = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ec9b0" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(() => btn.innerHTML = original, 2000);
  });
}
</script>
</body>
</html>
