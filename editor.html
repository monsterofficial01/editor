<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Executor</title>
<style>
  :root {
    --bg-color: #000000;
    --border-color: #2a2a2a;
    --accent-purple: #7c5dfa;
    --text-main: #ffffff;
    --text-dim: #9aa4b8;
    --status-bg: #0a0a0a;
    --hover-bg: rgba(255,255,255,0.05);
    --tab-bg: #1a1a1a;
    --tab-active-bg: #121212;
    --tab-border: #3a3a3a;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: var(--bg-color);
    color: var(--text-main);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #app-wrapper {
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-color);
  }

  /* Compact Tabs */
  .tabs-container {
    display: flex;
    background: #0a0a0a;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: #3a3a3a transparent;
    height: 38px;
  }
  .tabs-container::-webkit-scrollbar { height: 4px; }

  .tab {
    display: flex;
    align-items: center;
    padding: 0 14px;
    height: 38px;
    background: var(--tab-bg);
    border-right: 1px solid var(--tab-border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    font-size: 13px;
    position: relative;
  }
  .tab:hover { background: #1f1f1f; color: var(--text-main); }
  .tab.active {
    background: var(--tab-active-bg);
    color: var(--text-main);
    border-bottom: 2px solid var(--accent-purple);
  }
  .tab-name { margin-right: 6px; }
  .tab-close {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px; opacity: 0.6;
    font-size: 15px;
    transition: all 0.15s;
  }
  .tab-close:hover {
    opacity: 1;
    background: rgba(255,60,60,0.25);
    color: #ff7777;
  }
  .new-tab-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    background: var(--tab-bg);
    border-right: 1px solid var(--tab-border);
    cursor: pointer;
    color: var(--text-dim);
    font-size: 18px;
    transition: all 0.2s;
  }
  .new-tab-btn:hover { color: var(--accent-purple); background: #1f1f1f; }

  #monaco-container {
    flex: 1;
    position: relative;
    transition: opacity 0.18s ease;
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: var(--bg-color); z-index: 20;
  }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(124, 93, 250, 0.1); border-top-color: var(--accent-purple);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .action-buttons {
    position: absolute; right: 16px; bottom: 40px; display: flex; gap: 8px; z-index: 5;
  }
  .action-btn {
    width: 32px; height: 32px; background: #111; border: 1px solid var(--border-color);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--accent-purple); background: #1a1a1a; }
</style>
</head>
<body>
<div id="app-wrapper">

  <!-- Tabs -->
  <div class="tabs-container" id="tabs-container">
    <!-- Populated by JS -->
    <div class="new-tab-btn" onclick="addNewTab()" title="New Tab">＋</div>
  </div>

  <div id="monaco-container">
    <div id="loading"><div class="spinner"></div><span>LOADING EDITOR...</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
/* Snippets, RobloxAPI, Tab System, Editor Setup - same as before */
const Snippets = [ /* your full snippets array */ ];
const RobloxAPI = { /* your full RobloxAPI */ };

let tabs = [];
let currentTabId = null;
let editor = null;
let monacoRef = null;

function generateTabId() { return 'tab-' + Date.now(); }

function createTab(name = `Script${tabs.length + 1}.lua`) {
  const id = generateTabId();
  const model = monacoRef.editor.createModel('-- Monster Executor\n\n', 'luau');
  tabs.push({ id, name, model, isDirty: false });
  renderTabs();
  switchToTab(id);
}

function renderTabs() {
  const container = document.getElementById('tabs-container');
  container.querySelectorAll('.tab').forEach(el => el.remove());

  tabs.forEach(tab => {
    const tabEl = document.createElement('div');
    tabEl.className = `tab ${tab.id === currentTabId ? 'active' : ''}`;
    tabEl.innerHTML = `
      <span class="tab-name">${tab.name}${tab.isDirty ? ' *' : ''}</span>
      <span class="tab-close" onclick="event.stopImmediatePropagation(); closeTab('${tab.id}')">×</span>
    `;
    tabEl.onclick = () => switchToTab(tab.id);
    container.insertBefore(tabEl, container.lastElementChild);
  });
}

function switchToTab(tabId) {
  const tab = tabs.find(t => t.id === tabId);
  if (!tab || !editor) return;
  currentTabId = tabId;
  const mc = document.getElementById('monaco-container');
  mc.style.opacity = '0';
  setTimeout(() => {
    editor.setModel(tab.model);
    mc.style.opacity = '1';
    renderTabs();
  }, 120);
}

function closeTab(tabId) {
  if (tabs.length === 1) return;
  const index = tabs.findIndex(t => t.id === tabId);
  tabs[index].model.dispose();
  tabs.splice(index, 1);
  if (currentTabId === tabId) {
    switchToTab(tabs[Math.max(0, index-1)].id);
  } else {
    renderTabs();
  }
}

function addNewTab() { createTab(); }

function updateCurrentTabDirty() {
  const tab = tabs.find(t => t.id === currentTabId);
  if (tab) { tab.isDirty = true; renderTabs(); }
}

/* Monaco Setup */
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' }});

window.ClearFunction = () => {
  if (editor && currentTabId) {
    const tab = tabs.find(t => t.id === currentTabId);
    if (tab) {
      tab.model.setValue("");
      tab.isDirty = true;
      renderTabs();
    }
  }
};

window.GetContent = () => editor ? editor.getValue() : "";

require(['vs/editor/editor.main'], function() {
  monacoRef = monaco;
  monaco.editor.defineTheme('app-theme', { /* your theme object */ });
  registerLuau();

  editor = monaco.editor.create(document.getElementById('monaco-container'), {
    value: "-- Monster Executor",
    language: 'luau',
    theme: 'app-theme',
    automaticLayout: true,
    fontSize: 13,
    fontFamily: "'Fira Code', Consolas, monospace",
    minimap: { enabled: false },
    padding: { top: 12, bottom: 12 },
    cursorBlinking: "smooth",
    smoothScrolling: true
  });

  createTab("Main.lua");
  editor.onDidChangeModelContent(() => updateCurrentTabDirty());
  document.getElementById('loading').style.display = 'none';
});

function registerLuau() { /* your original registerLuau function */ }
function copyCode() { navigator.clipboard.writeText(GetContent()); }

/* Shortcuts */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 't') { e.preventDefault(); addNewTab(); }
  if (e.ctrlKey && e.key === 'w') { e.preventDefault(); if (currentTabId) closeTab(currentTabId); }
});
</script>
</body>
</html>
