<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monster Executor</title>
<style>
  :root {
    --bg-color: #000000;
    --border-color: #2a2a2a;
    --accent-purple: #7c5dfa;
    --text-main: #ffffff;
    --text-dim: #9aa4b8;
    --status-bg: #0a0a0a;
    --hover-bg: rgba(255,255,255,0.05);
    --tab-bg: #1a1a1a;
    --tab-active-bg: #121212;
    --tab-border: #3a3a3a;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: var(--bg-color);
    color: var(--text-main);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #app-wrapper {
    position: absolute;
    inset: 8px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-color);
  }

  /* Title Bar */
  .title-bar {
    height: 36px;
    background: #0f0f0f;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    user-select: none;
    z-index: 15;
  }
  .logo { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin-right: 12px; }
  .logo svg { fill: #fff; width: 20px; height: 20px; }
  .title-area { font-size: 12px; font-weight: 500; opacity: 0.8; display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--accent-purple); color: white; font-size: 9px; padding: 1px 4px; border-radius: 2px; text-transform: uppercase; }
  .window-controls { margin-left: auto; display: flex; gap: 8px; }
  .control-btn {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; background: var(--hover-bg); cursor: pointer; transition: background 0.2s;
  }
  .control-btn:hover { background: rgba(255,255,255,0.1); }

  /* Tabs */
  .tabs-container {
    display: flex;
    background: #0a0a0a;
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: #3a3a3a transparent;
  }
  .tabs-container::-webkit-scrollbar { height: 4px; }
  .tab {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: var(--tab-bg);
    border-right: 1px solid var(--tab-border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    min-width: 130px;
    position: relative;
  }
  .tab:hover { background: #1f1f1f; color: var(--text-main); }
  .tab.active {
    background: var(--tab-active-bg);
    color: var(--text-main);
    border-bottom: 2px solid var(--accent-purple);
    font-weight: 500;
  }
  .tab-name { margin-right: 8px; font-size: 13px; }
  .tab-close {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px; opacity: 0.6;
    transition: all 0.15s;
  }
  .tab-close:hover {
    opacity: 1;
    background: rgba(255,60,60,0.2);
    color: #ff6666;
  }
  .new-tab-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 100%;
    background: var(--tab-bg);
    border-right: 1px solid var(--tab-border);
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .new-tab-btn:hover { color: var(--accent-purple); background: #1f1f1f; }

  #monaco-container {
    flex: 1;
    position: relative;
    transition: opacity 0.18s ease;
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; background: var(--bg-color); z-index: 20;
  }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(124, 93, 250, 0.1); border-top-color: var(--accent-purple);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .action-buttons {
    position: absolute; right: 16px; bottom: 40px; display: flex; gap: 8px; z-index: 5;
  }
  .action-btn {
    width: 32px; height: 32px; background: #111; border: 1px solid var(--border-color);
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #fff; transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--accent-purple); background: #1a1a1a; }
  .action-btn svg { width: 16px; height: 16px; }

  #statusbar {
    height: 24px; background: var(--status-bg); border-top: 1px solid var(--border-color);
    display: flex; align-items: center; padding: 0 12px; gap: 16px;
    font-size: 11px; color: var(--text-dim); user-select: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="app-wrapper">
  <!-- Title Bar -->
  <div class="title-bar">
    <div class="title-area">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4L4 8L12 12L20 8L12 4Z" fill="#7c5dfa"/>
          <path d="M4 16L12 20L20 16" stroke="#7c5dfa" stroke-width="2"/>
        </svg>
      </div>
      <span>Monster Executor</span>
      <div class="badge">BETA</div>
    </div>
    <div class="window-controls">
      <div class="control-btn" onclick="minimizeWindow()">−</div>
      <div class="control-btn" onclick="maximizeWindow()">□</div>
      <div class="control-btn" onclick="closeWindow()">×</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-container" id="tabs-container">
    <!-- Populated by JS -->
    <div class="new-tab-btn" onclick="addNewTab()" title="New Tab">＋</div>
  </div>

  <div id="monaco-container">
    <div id="loading"><div class="spinner"></div><span>LOADING EDITOR...</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
/* Snippets & RobloxAPI (unchanged) */
const Snippets = [ /* ... your original snippets ... */ ];
const RobloxAPI = { /* ... your original API ... */ };

/* Tab System */
let tabs = [];
let currentTabId = null;
let editor = null;
let monacoRef = null;

function generateTabId() { return 'tab-' + Date.now(); }

function createTab(name = `Script${tabs.length + 1}.lua`) {
  const id = generateTabId();
  const model = monacoRef.editor.createModel('-- Monster Executor\n\n', 'luau');
  
  tabs.push({ id, name, model, isDirty: false });
  renderTabs();
  switchToTab(id);
}

function renderTabs() {
  const container = document.getElementById('tabs-container');
  container.querySelectorAll('.tab').forEach(el => el.remove());

  tabs.forEach(tab => {
    const tabEl = document.createElement('div');
    tabEl.className = `tab ${tab.id === currentTabId ? 'active' : ''}`;
    tabEl.innerHTML = `
      <div class="tab-name">${tab.name}${tab.isDirty ? ' *' : ''}</div>
      <div class="tab-close" onclick="event.stopImmediatePropagation(); closeTab('${tab.id}')">×</div>
    `;
    tabEl.onclick = () => switchToTab(tab.id);
    container.insertBefore(tabEl, container.lastElementChild);
  });
}

function switchToTab(tabId) {
  const tab = tabs.find(t => t.id === tabId);
  if (!tab || !editor) return;

  currentTabId = tabId;
  const monacoContainer = document.getElementById('monaco-container');
  
  monacoContainer.style.opacity = '0';
  
  setTimeout(() => {
    editor.setModel(tab.model);
    monacoContainer.style.opacity = '1';
    renderTabs();
  }, 120);
}

function closeTab(tabId) {
  if (tabs.length === 1) return; // keep at least one tab

  const index = tabs.findIndex(t => t.id === tabId);
  const tab = tabs[index];
  if (tab.model) tab.model.dispose();
  tabs.splice(index, 1);

  if (currentTabId === tabId) {
    switchToTab(tabs[Math.max(0, index - 1)].id);
  } else {
    renderTabs();
  }
}

function addNewTab() {
  createTab();
}

function updateCurrentTabDirty() {
  const tab = tabs.find(t => t.id === currentTabId);
  if (tab) {
    tab.isDirty = true;
    renderTabs();
  }
}

/* Editor Setup */
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs' }});

window.ClearFunction = () => {
  if (editor && currentTabId) {
    const tab = tabs.find(t => t.id === currentTabId);
    if (tab) {
      tab.model.setValue("");
      tab.isDirty = true;
      renderTabs();
    }
  }
};

window.GetContent = () => editor ? editor.getValue() : "";

require(['vs/editor/editor.main'], function() {
  monacoRef = monaco;
  monaco.editor.defineTheme('app-theme', { /* your original theme */ });
  registerLuau();

  editor = monaco.editor.create(document.getElementById('monaco-container'), {
    value: "-- Monster Executor",
    language: 'luau',
    theme: 'app-theme',
    automaticLayout: true,
    fontSize: 13,
    fontFamily: "'Fira Code', 'Cascadia Code', Consolas, monospace",
    minimap: { enabled: false },
    padding: { top: 12, bottom: 12 },
    cursorBlinking: "smooth",
    smoothScrolling: true,
    renderLineHighlight: "all"
  });

  // Create first tab
  createTab("Main.lua");

  editor.onDidChangeModelContent(() => updateCurrentTabDirty());
  document.getElementById('loading').style.display = 'none';
});

/* Rest of your original functions (registerLuau, copyCode, etc.) */
function registerLuau() { /* your original registerLuau */ }
function copyCode() { /* your original copyCode */ }

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 't') { e.preventDefault(); addNewTab(); }
  if (e.ctrlKey && e.key === 'w') { e.preventDefault(); if (currentTabId) closeTab(currentTabId); }
});
</script>
</body>
</html>
